<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuildCal - Live Interactive Paint Estimator</title>
  <style>
    :root {
      --primary: #FF6600;
      --primary-hover: #e55c00;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background-color: var(--bg-color); 
      background-image: 
        radial-gradient(rgba(255, 102, 0, 0.05) 1px, transparent 0),
        linear-gradient(to right, rgba(0, 0, 0, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.02) 1px, transparent 1px);
      background-size: 24px 24px, 40px 40px, 40px 40px;
      color: var(--text-color); 
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #ffffff;
      border-bottom: 2px solid #e2e8f0;
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    header img { height: 38px; width: auto; object-fit: contain; }
    .texture-cards { display: flex; gap: 0.6rem; margin-top: 0.4rem; }
    .texture-option {
      flex: 1;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0.75rem 0.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }
    .texture-option:hover { border-color: var(--primary); background: #fff; }
    .texture-option.active {
      border-color: var(--primary);
      background: #fff8f5;
      font-weight: 700;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(255, 102, 0, 0.12);
    }
    .texture-desc {
      display: block;
      font-size: 0.72rem;
      font-weight: 400;
      color: #64748b;
      margin-top: 0.25rem;
      line-height: 1.3;
    .wall-preview {
      width: 100%;
      height: 60px;
      border-radius: 8px;
      background: #cbd5e1;
      margin-bottom: 1.2rem;
      position: relative;
      overflow: hidden;
      border: 2px solid #94a3b8;
    }
    .wall-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #FF6600, #ff8533);
      transition: width 0.5s ease-in-out, opacity 0.3s ease;
    }

              <span class="texture-desc">Painted drywall / smooth coat</span>
            </div>
            <div class="texture-option" data-value="1.15" onclick="selectTexture(this)">
              <strong>Medium</strong>
              <span class="texture-desc">Orange peel / knockdown (+15%)</span>
            </div>
            <div class="texture-option" data-value="1.30" onclick="selectTexture(this)">
              <strong>Rough</strong>
              <span class="texture-desc">Stucco / brick / concrete (+30%)</span>
            </div>
          </div>
          <input type="hidden" id="texture" value="1.0">
        </div>
      </div>

      <div class="results-panel">
        <h2>
          <span>Live Estimate</span>
          <span class="live-tag">Auto-updating</span>
        </h2>
        
        <div class="estimate-value" id="paintAmount">2.15 Gallons</div>
        <div class="estimate-details" id="paintDetails">Total Paintable Area: 432 sq ft | Coats: 2</div>

        <div class="wall-preview">
          <div class="wall-fill" id="wallFill"></div>
        </div>

        <div class="can-breakdown">
          <h3>Recommended Container Purchase</h3>
          <div class="can-list" id="canList">
            <div class="can-badge">2 x Gallon Cans</div>
            <div class="can-badge">1 x Quart Can</div>
          </div>
        </div>

        <div class="guide-block">
          <h3>Recommended 1 vs 2 Coats</h3>
          <p>Use 1 coat for simple touch-ups on matching colors. Use 2 coats for maximum richness and covering dark walls.</p>
        </div>
      </div>

    </div>
  </div>

  <footer>
    <p>BuildCal Paint Estimator &copy; 2026</p>
      document.getElementById('paintAmount').innerText = `${paintNeeded.toFixed(2)} ${unitLabel}`;
      document.getElementById('paintDetails').innerText = `Total Paintable Area: ${Math.round(totalCoverageNeeded)} ${areaLabel} | Coats: ${coats}`;

      let percentage = Math.min((paintNeeded / 5) * 100, 100);
      document.getElementById('wallFill').style.width = `${percentage}%`;

      calculateCans(paintNeeded, unit);
    }

    function calculateCans(amount, unit) {
      const canList = document.getElementById('canList');
      let html = '';

      if (unit === 'feet') {
        let gallons = Math.floor(amount);
        let remainder = amount - gallons;
        let quarts = Math.ceil(remainder * 4);

        if (quarts === 4) {
          gallons += 1;
          quarts = 0;
        }

        if (gallons > 0) html += `<div class="can-badge">${gallons} x Gallon Bucket${gallons > 1 ? 's' : ''}</div>`;
        if (quarts > 0) html += `<div class="can-badge">${quarts} x Quart Can${quarts > 1 ? 's' : ''}</div>`;
      } else {
        let largeBuckets = Math.floor(amount / 5);
        let remainder = amount % 5;
        let smallCans = Math.ceil(remainder);

        if (smallCans === 5) {
          largeBuckets += 1;
          smallCans = 0;
        }

        if (largeBuckets > 0) html += `<div class="can-badge">${largeBuckets} x 5-Liter Bucket${largeBuckets > 1 ? 's' : ''}</div>`;
        if (smallCans > 0) html += `<div class="can-badge">${smallCans} x 1-Liter Can${smallCans > 1 ? 's' : ''}</div>`;
      }

      canList.innerHTML = html || `<div class="can-badge">1 x Small Can</div>`;
    }

    window.onload = calculatePaint;
  </script>
</body>
</html>
