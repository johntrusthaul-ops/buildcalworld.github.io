<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildCal - Live Interactive Paint Estimator</title>
<style>
:root {
--primary: #FF6600;
--card-bg: #ffffff;
--text-color: #1e293b;
--border-color: #cbd5e1;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

body {
background-color: #f1f5f9;
color: var(--text-color);
line-height: 1.5;
min-height: 100vh;
display: flex;
flex-direction: column;
}

header {
background: #ffffff;
border-bottom: 2px solid #e2e8f0;
padding: 0.9rem 2rem;
display: flex;
align-items: center;
justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 12px; }
header span { font-size: 1.35rem; font-weight: 700; color: #0f172a; }

.live-badge {
display: flex;
align-items: center;
gap: 6px;
font-size: 0.78rem;
font-weight: 600;
color: #16a34a;
background: #f0fdf4;
padding: 0.25rem 0.65rem;
border-radius: 99px;
border: 1px solid #bbf7d0;
}
.pulse-dot {
width: 8px;
height: 8px;
background-color: #16a34a;
border-radius: 50%;
animation: pulse 1.5s infinite;
}
@keyframes pulse {
0% { opacity: 1; }
50% { opacity: 0.4; }
100% { opacity: 1; }
}

.wrapper {
max-width: 1100px;
margin: 2rem auto;
padding: 0 1.5rem;
width: 100%;
flex: 1;
}

.page-title { margin-bottom: 1.5rem; color: #0f172a; }
.page-title h1 { font-size: 1.8rem; font-weight: 800; }
.page-title p { font-size: 0.95rem; color: #64748b; }

.calculator-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 2rem;
}

.card, .results-panel {
background: var(--card-bg);
border-radius: 14px;
padding: 2rem;
box-shadow: 0 4px 20px rgba(0,0,0,0.05);
border: 1px solid var(--border-color);
}

.form-group { margin-bottom: 1.1rem; }
label { display: block; font-weight: 600; margin-bottom: 0.35rem; font-size: 0.88rem; color: #334155; }
input, select {
width: 100%;
padding: 0.75rem;
border: 1px solid #cbd5e1;
border-radius: 8px;
font-size: 0.95rem;
background: #f8fafc;
}
.row { display: flex; gap: 1rem; }
.row .form-group { flex: 1; }

.texture-cards { display: flex; gap: 0.6rem; margin-top: 0.4rem; }
.texture-option {
flex: 1;
background: #f8fafc;
border: 1px solid #cbd5e1;
border-radius: 8px;
padding: 0.75rem 0.5rem;
text-align: center;
cursor: pointer;
font-size: 0.85rem;
user-select: none;
transition: all 0.2s ease;
}
.texture-option * { pointer-events: none; }
.texture-option:hover { border-color: var(--primary); background: #fff; }
.texture-option.active {
border-color: var(--primary);
background: #fff8f5;
font-weight: 700;
color: var(--primary);
box-shadow: 0 0 0 2px rgba(255, 102, 0, 0.2);
}
.texture-desc {
display: block;
font-size: 0.72rem;
color: #64748b;
margin-top: 0.25rem;
}

.results-panel {
background: linear-gradient(145deg, #f0f9ff 0%, #e0f2fe 100%);
border: 1px solid #bae6fd;
}

.results-panel h2 {
font-size: 1.15rem;
color: #0369a1;
margin-bottom: 0.3rem;
display: flex;
justify-content: space-between;
align-items: center;
}
.live-tag {
font-size: 0.7rem;
background: #0284c7;
color: #fff;
padding: 0.15rem 0.5rem;
border-radius: 4px;
}

.estimate-value {
font-size: 2.3rem;
font-weight: 800;
color: #0284c7;
margin: 0.4rem 0;
}
.estimate-details { font-size: 0.92rem; color: #334155; margin-bottom: 1.2rem; font-weight: 500; }

.wall-preview {
width: 100%;
height: 60px;
border-radius: 8px;
background: #cbd5e1;
margin-bottom: 1.2rem;
overflow: hidden;
border: 2px solid #94a3b8;
}
.wall-fill {
height: 100%;
width: 0%;
background: linear-gradient(90deg, #FF6600, #ff8533);
transition: width 0.5s ease-in-out;
}

.can-breakdown {
background: rgba(255, 255, 255, 0.85);
border: 1px solid #93c5fd;
border-radius: 10px;
padding: 1rem;
margin-bottom: 1.2rem;
}
.can-breakdown h3 { font-size: 0.9rem; color: #0369a1; margin-bottom: 0.2rem; }
.breakdown-desc { font-size: 0.8rem; color: #64748b; margin-bottom: 0.6rem; }

.can-list { display: flex; gap: 0.8rem; flex-wrap: wrap; }
.can-badge {
background: #e0f2fe;
color: #0369a1;
border: 1px solid #bae6fd;
padding: 0.4rem 0.7rem;
border-radius: 6px;
font-size: 0.85rem;
font-weight: 700;
}

.animated-paint-box {
width: 100%;
height: 160px;
border-radius: 10px;
overflow: hidden;
position: relative;
border: 2px solid #93c5fd;
box-shadow: 0 4px 12px rgba(3, 105, 161, 0.15);
margin-top: 0.5rem;
background: #eef1f5;
}

.wall-base {
position: absolute;
inset: 0;
background-image: repeating-linear-gradient(135deg, #e2e8f0 0, #e2e8f0 12px, #eef1f5 12px, #eef1f5 24px);
}

.wall-painted {
position: absolute;
top: 0;
left: 0;
height: 100%;
width: 0%;
background: linear-gradient(135deg, #ff7a1a, #ffa15c);
box-shadow: inset -6px 0 10px rgba(0,0,0,0.18);
animation: paintSweep 5s ease-in-out infinite;
}
.wall-painted::after {
content: "";
position: absolute;
inset: 0;
background-image: repeating-linear-gradient(100deg, rgba(255,255,255,0.16) 0, rgba(255,255,255,0.16) 3px, transparent 3px, transparent 14px);
}

.roller-wrap {
position: absolute;
top: 50%;
left: -8%;
transform: translate(-50%, -50%);
animation: rollerMove 5s ease-in-out infinite;
z-index: 2;
}
.roller-bob {
animation: rollerBob 0.35s ease-in-out infinite alternate;
}

.paint-drip {
position: absolute;
top: 62%;
width: 5px;
height: 5px;
border-radius: 50%;
background: #ff8f3d;
animation: dripFall 5s ease-in infinite;
opacity: 0;
z-index: 1;
}
.paint-drip.d2 { animation-delay: 0.35s; }
.paint-drip.d3 { animation-delay: 0.7s; }

@keyframes paintSweep {
0%   { width: 0%;   opacity: 1; }
70%  { width: 100%; opacity: 1; }
85%  { width: 100%; opacity: 1; }
92%  { width: 100%; opacity: 0; }
93%  { width: 0%;   opacity: 0; }
100% { width: 0%;   opacity: 1; }
}
@keyframes rollerMove {
0%   { left: -8%;  opacity: 1; }
70%  { left: 104%; opacity: 1; }
85%  { left: 104%; opacity: 1; }
92%  { left: 104%; opacity: 0; }
93%  { left: -8%;  opacity: 0; }
100% { left: -8%;  opacity: 1; }
}
@keyframes rollerBob {
0%   { transform: translateY(0); }
100% { transform: translateY(3px); }
}
@keyframes dripFall {
0%, 68%   { opacity: 0; transform: translateY(0); }
72%       { opacity: 0.9; transform: translateY(0); }
84%       { opacity: 0.9; transform: translateY(22px); }
90%, 100% { opacity: 0; transform: translateY(26px); }
}

footer {
text-align: center;
padding: 1.5rem;
font-size: 0.85rem;
color: #64748b;
background: #ffffff;
border-top: 1px solid var(--border-color);
margin-top: auto;
}

@media (max-width: 768px) {
.calculator-grid { grid-template-columns: 1fr; }
}
</style>
</head>
